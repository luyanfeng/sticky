name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  build:
    if: github.event_name != 'issue_comment'
    uses: linuxmint/github-actions/.github/workflows/do-builds.yml@master
    with:
      commit_id: master
      dependencies:
      upload_artifacts: true
      artifact_retention_days: 1

  build-ubuntu:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.04"
            image: ubuntu:24.04
          - version: "26.04"
            image: ubuntu:26.04
          - version: "trixie"
            image: debian:trixie
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git & ca-certs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python dpkg-dev gettext meson python3
      - name: Build .deb
        run: dpkg-buildpackage --no-sign
      - name: Stage artifacts
        run: cp ../sticky_* .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.version }}
          path: |
            sticky_*

  generate-test-packages:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    uses: linuxmint/github-actions/.github/workflows/generate-test-packages.yml@master
    secrets: inherit
    with:
      comment_body: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      comment_id: ${{ github.event.comment.id }}
      issue_number: ${{ github.event.issue.number }}
      dependencies:
  release-aggregate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: v
        run: |
          VER=$(dpkg-parsechangelog | awk '/^Version:/ {print $2}' | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List
        run: ls -la dist/
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.v.outputs.version }}
          TAG="v${VER}"
          gh release delete "$TAG" -y --cleanup-tag --repo luyanfeng/sticky || true
          sleep 5
          gh release create "$TAG" --title "sticky v${VER}" --notes "Release v${VER}" --repo luyanfeng/sticky dist/* 2>&1 | tail -10

