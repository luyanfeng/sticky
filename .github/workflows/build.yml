name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  build:
    if: github.event_name != 'issue_comment'
    uses: linuxmint/github-actions/.github/workflows/do-builds.yml@master
    with:
      commit_id: master
      ############################## Comma separated list - like 'linuxmint/xapp, linuxmint/cinnamon-desktop'
      dependencies:
      ##############################

  # Build .deb packages for stock Ubuntu amd64 - the do-builds workflow above
  # only targets Linux Mint and LMDE build images.
  build-ubuntu:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.04"
            image: ubuntu:24.04
          - version: "26.04"
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debhelper dh-python dpkg-dev gettext meson python3
      - name: Build .deb package
        run: dpkg-buildpackage --no-sign
      - name: List build output
        run: ls -la ..
      - name: Stage artifacts
        run: cp ../sticky_* .
      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sticky-ubuntu-${{ matrix.version }}-amd64
          path: |
            sticky_*

  # Generate test packages when /generate-test-packages is commented on a PR
  generate-test-packages:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    uses: linuxmint/github-actions/.github/workflows/generate-test-packages.yml@master
    secrets: inherit
    with:
      comment_body: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      comment_id: ${{ github.event.comment.id }}
      issue_number: ${{ github.event.issue.number }}
      ############################## Comma separated list - like 'linuxmint/xapp, linuxmint/cinnamon-desktop'
      dependencies:
