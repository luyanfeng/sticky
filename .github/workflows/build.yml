name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  issue_comment:
    types: [created]

# Releasing deletes and recreates the version tag, so overlapping runs on the
# same branch must not race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build .deb packages for Linux Mint and LMDE using the official build images.
  # The upstream linuxmint/github-actions reusable workflows always publish a
  # per-distro release named master.<mint_version>; building here instead lets
  # every platform be published from a single versioned release.
  build-mint:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mint_version: mint22
            image: linuxmintd/mint22.3-amd64
          - mint_version: lmde7
            image: linuxmintd/lmde7-amd64
          - mint_version: mint27
            image: linuxmintd/mint27-amd64
    container:
      image: ${{ matrix.image }}
      # Disable seccomp until the container manager recognizes clone3(),
      # <https://github.com/actions/virtual-environments/issues/3812>.
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Update build environment
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          sudo apt-get update
          sudo apt-get -y dist-upgrade
          sudo apt-get install -y python-is-python3
        shell: bash
      - name: Install first-class dependencies
        uses: linuxmint/github-actions/install-deps@master
        with:
          mint_version: ${{ matrix.mint_version }}
          dependencies:
      - name: Build
        uses: linuxmint/github-actions/real-build@master
      - name: Isolate packages
        run: |
          mkdir -p ./output/packages
          mv ../*.changes ./output
          mv ../*.*deb ./output/packages
        shell: bash
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.mint_version }}
          path: |
            output/packages/*
            output/*.changes
          retention-days: 1

  # Build .deb packages for stock Ubuntu and Debian amd64 (the Mint images above
  # do not cover these releases).
  build-other:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.04"
            image: ubuntu:24.04
          - version: "26.04"
            image: ubuntu:26.04
          - version: "trixie"
            image: debian:trixie
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git & ca-certs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python dpkg-dev gettext meson python3
      - name: Build .deb
        run: dpkg-buildpackage --no-sign
      - name: Stage artifacts
        run: cp ../sticky_* .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.version }}
          path: |
            sticky_*
          retention-days: 1

  # Publish every platform's build output in a single versioned release.
  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    needs: [build-mint, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: v
        run: |
          VER=$(dpkg-parsechangelog | awk '/^Version:/ {print $2}' | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          # Every platform ships the same file names, so prefix each with its
          # artifact name to keep them apart in the release.
          mkdir -p dist
          for dir in artifacts/*/; do
            prefix=$(basename "$dir")
            while IFS= read -r -d '' file; do
              cp "$file" "dist/${prefix}_$(basename "$file")"
            done < <(find "$dir" -type f -print0)
          done
          ls -la dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release delete "$TAG" -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" \
            --title "sticky ${{ steps.v.outputs.version }}" \
            --notes "sticky ${{ steps.v.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  generate-test-packages:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    uses: linuxmint/github-actions/.github/workflows/generate-test-packages.yml@master
    secrets: inherit
    with:
      comment_body: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      comment_id: ${{ github.event.comment.id }}
      issue_number: ${{ github.event.issue.number }}
      dependencies:
