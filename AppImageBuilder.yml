# appimage-builder recipe, see https://appimage-builder.readthedocs.io
#
# Built inside the AppImageCrafters/appimage-builder container (Ubuntu 20.04).
# Packages are pulled from Ubuntu 22.04 so that XApp/Gspell are new enough for
# the XApp.StyleManager API the app uses.
version: 1

script:
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gettext python3 python3-pip squashfs-tools libglib2.0-bin
  - python3 -m pip install --upgrade meson ninja
  - rm -rf AppDir build
  - meson setup build --prefix=/usr
  - ninja -C build
  - DESTDIR=$TARGET_APPDIR ninja -C build install
  - sed -i "s/__DEB_VERSION__/${APP_VERSION}/g" $TARGET_APPDIR/usr/lib/sticky/sticky.py
  - rm -rf build

AppDir:
  path: ./AppDir

  app_info:
    id: org.x.sticky
    name: sticky
    icon: sticky
    version: !ENV ${APP_VERSION}
    # appimage-builder requires an ELF binary here, so start the bundled
    # interpreter and point it at the application script.
    exec: usr/bin/python3
    exec_args: "$APPDIR/usr/lib/sticky/sticky.py $@"

  apt:
    arch: amd64
    # The container keyring only trusts Ubuntu 20.04 but the packages come from
    # 22.04 (XApp >= 2.2 is required for XApp.StyleManager), so skip signature
    # verification for these well-known archive URLs.
    allow_unauthenticated: true
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main universe'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main universe'
      - sourceline: 'deb [arch=amd64] http://security.ubuntu.com/ubuntu/ jammy-security main universe'
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-xapp
      - gir1.2-glib-2.0
      - gir1.2-gtk-3.0
      - gir1.2-xapp-1.0
      - gir1.2-gspell-1
      - gir1.2-pango-1.0
      - gir1.2-atk-1.0
      - gir1.2-gdkpixbuf-2.0
      - gir1.2-atspi-2.0
      - libxapp1
      - libgspell-1-2
      - libgtk-3-0
      - librsvg2-common
      - dconf-gsettings-backend
      - gsettings-desktop-schemas
      - adwaita-icon-theme
    exclude:
      - usr/share/doc

  files:
    exclude:
      # Documentation and packaging metadata.
      - usr/share/doc
      - usr/share/man
      - usr/share/info
      - usr/share/lintian
      - usr/share/gdb
      - usr/share/bug
      - usr/share/pkgconfig
      - usr/share/help
      - usr/share/locale-langpack
      # Emacs, dictionary and system service leftovers, unused by the app.
      - usr/share/dict
      - usr/share/dictionaries-common
      - usr/share/emacsen-common
      - usr/lib/emacsen-common
      - usr/share/mate-panel
      - usr/share/upstart
      - usr/share/pam-configs
      - usr/share/session-migration
      - usr/share/binfmts
      - usr/lib/binfmt.d
      - usr/lib/systemd
      - usr/lib/sysusers.d
      - usr/lib/tmpfiles.d
      - usr/lib/valgrind
      # systemd runtime, pulled in through libpam-systemd but never used here.
      - lib/systemd
      - bin/systemctl*
      - bin/systemd*
      - usr/bin/systemd-*
      - etc/systemd
      - etc/xdg/systemd
      - var/lib/systemd
      - var/lib/polkit-1
      # Shell completions and polkit metadata for the bundled libraries.
      - usr/share/bash-completion
      - usr/share/zsh
      - usr/share/polkit-1
      # Perl is only pulled in as a dependency and is not used by the app.
      - usr/bin/perl*
      - usr/lib/x86_64-linux-gnu/perl*
      - usr/share/perl*
      # Icon themes pulled in by adwaita-icon-theme but not used by the app.
      # They are PNGs, so they do not shrink under compression.
      - usr/share/icons/Humanity
      - usr/share/icons/Humanity-Dark
      - usr/share/icons/ubuntu-mono-dark
      - usr/share/icons/ubuntu-mono-light
      - usr/share/icons/LoginIcons
      # X11 keyboard layout data, only used by keyboard-configuration tooling.
      - usr/share/X11/xkb

  # GSettings needs a compiled schema cache; glib looks it up through
  # XDG_DATA_DIRS, which the generated runtime sets to $APPDIR/usr/share.
  after_bundle:
    - glib-compile-schemas $TARGET_APPDIR/usr/share/glib-2.0/schemas

  runtime:
    env:
      # The runtime already sets PATH, XDG_DATA_DIRS and APPDIR_LIBRARY_PATH.
      # dist-packages is not on the bundled interpreter's default search path
      # and the typelib directory is not auto-detected, so set both here.
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages'
      GI_TYPELIB_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0'

AppImage:
  arch: x86_64
  update-information: None
  sign-key: None
